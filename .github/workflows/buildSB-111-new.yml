name: build SB 111 new

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v1.11.15
  VERSION_NEW: v1.11.15-utls-providers

  TAG_WINDOWS: with_gvisor,with_quic,with_utls,with_dhcp,with_ech,with_wireguard,with_reality_server,with_acme,with_clash_api
  TAG_WINDOWS_ALL: with_gvisor,with_quic,with_utls,with_dhcp,with_ech,with_wireguard,with_reality_server,with_acme,with_clash_api,with_v2ray_api,with_grpc

jobs:
  # ======== 阶段一：Windows 并行矩阵编译 ========
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go_version:
          - '1.24'
          - '1.25'
        level:
          - v1
          - v2
          - v3
          - v4
        type:
          - normal
          - all

    steps:
      - name: Setup Go ${{ matrix.go_version }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ matrix.go_version }}'
          cache: false

      - name: Checkout sing-box
        uses: actions/checkout@v5
        with:
          repository: you10069/SingboxFork
          ref: ${{ env.VERSION_NEW }}

      - name: Build Windows
        shell: bash
        run: |
          set -euo pipefail

          export CGO_ENABLED=0
          export GOOS=windows
          export GOARCH=amd64
          export GOAMD64="${{ matrix.level }}"

          GO_VERSION_SUFFIX="go${{ matrix.go_version }}"

          # 选择编译标签
          if [ "${{ matrix.type }}" = "all" ]; then
            TAGS="${{ env.TAG_WINDOWS_ALL }}"
          else
            TAGS="${{ env.TAG_WINDOWS }}"
          fi

          # 程序内部版本号
          # normal：new-v1.11.15-v1-go1.24
          # all：new-v1.11.15-v1-all-go1.24
          VERSION_STR="new-${{ env.VERSION }}-${{ matrix.level }}"

          if [ "${{ matrix.type }}" = "all" ]; then
            VERSION_STR="${VERSION_STR}-all"
          fi

          VERSION_STR="${VERSION_STR}-${GO_VERSION_SUFFIX}"

          # 输出文件名
          # normal：sing-box-new-v1-go1.24.exe
          # all：sing-box-new-v1-all-go1.24.exe
          OUT="sing-box-new-${{ matrix.level }}"

          if [ "${{ matrix.type }}" = "all" ]; then
            OUT="${OUT}-all"
          fi

          OUT="${OUT}-${GO_VERSION_SUFFIX}.exe"

          echo "================================================="
          echo "Go version:  ${{ matrix.go_version }}"
          echo "GOOS:        $GOOS"
          echo "GOARCH:      $GOARCH"
          echo "GOAMD64:     $GOAMD64"
          echo "CGO_ENABLED: $CGO_ENABLED"
          echo "Build type:  ${{ matrix.type }}"
          echo "Output:      $OUT"
          echo "Version:     $VERSION_STR"
          echo "Tags:        $TAGS"
          echo "================================================="

          go version
          go env GOOS GOARCH GOAMD64 CGO_ENABLED

          mkdir -p dist

          go mod tidy
          go build \
            -tags "$TAGS" \
            -v \
            -trimpath \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION_STR -s -w -buildid=" \
            -o "dist/$OUT" \
            ./cmd/sing-box

          echo
          echo "Build completed:"
          ls -lh "dist/$OUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-windows-new-${{ matrix.level }}-${{ matrix.type }}-go${{ matrix.go_version }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

  # ======== 阶段二：统一合并与发布 ========
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release_files
          merge-multiple: true

      - name: Check Release Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release files:"
          find release_files -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "File details:"
          ls -lh release_files

          FILE_COUNT=$(find release_files -maxdepth 1 -type f -name '*.exe' | wc -l)

          echo
          echo "Executable count: $FILE_COUNT"

          if [ "$FILE_COUNT" -ne 16 ]; then
            echo "Expected 16 executable files, but found $FILE_COUNT."
            exit 1
          fi

      - name: Set TAG_DATE
        shell: bash
        run: |
          echo "TAG_DATE=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: sb-new-${{ env.VERSION }}-${{ env.TAG_DATE }}
          name: sb-new-${{ env.VERSION }}-${{ env.TAG_DATE }}
          files: release_files/*.exe
          draft: false
          prerelease: true
          make_latest: false
