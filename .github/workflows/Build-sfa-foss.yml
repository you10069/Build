name: Build SFA FOSS APK

on:
  workflow_dispatch:
    inputs:
      sing_box_repo:            # 手动可临时换 sing-box 仓库
        description: sing-box 仓库 (owner/name)
        # default: SagerNet/sing-box
        default: you10069/SingboxFork
      sing_box_ref:
        description: sing-box 版本
        # default: v1.11.15
        default: v1.11.15-utls-providers-rev
      sfa_repo:                 # 手动可临时换 sing-box-for-android 仓库
        description: sing-box-for-android 仓库 (owner/name)
        default: SagerNet/sing-box-for-android
      sfa_ref:
        description: sing-box-for-android 版本
        default: 7f1fa971e3c7bbc504c2bd455f4e813a562990cb
  push:
    tags: ["v*"]

env:
  SING_BOX_REF: "v1.11.15"                              # 与 version.properties 的 VERSION 对齐
  SFA_REF: "7f1fa971e3c7bbc504c2bd455f4e813a562990cb"    # sing-box-for-android 提交
  GO_VERSION: "1.24"                                   # 来自 version.properties 的 GO_VERSION

jobs:
  build-foss:
    name: Build SFA FOSS
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 打 tag 时用于创建 GitHub Release

    steps:
      # ---- 第 1 步：拉取两份源码，放到同级目录 ----
      # build_libbox 会把 .aar 拷到 ../sing-box-for-android/app/libs，
      # 所以 sing-box 和 sing-box-for-android 必须是同级目录
      - name: Checkout sing-box core
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.sing_box_repo }}
          ref: ${{ inputs.sing_box_ref }}
          path: sing-box
          fetch-depth: 0        # 完整 clone，保证 git describe 能读到 tag，正确写入版本号

      - name: Checkout sing-box-for-android (SFA)
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.sfa_repo }}
          ref: ${{ inputs.sfa_ref }}
          path: sing-box-for-android

      # ---- 第 2 步：安装工具链 ----
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum    # 缓存 Go module

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"          # build_libbox 强制要求 openjdk 17；keytool 也来自这里

      # ---- 第 3 步：安装 Android NDK ----
      # 不要用 android-actions/setup-android：它会安装已废弃的 tools 包而报
      # "Failed to find package 'tools'"。runner 自带 Android SDK（许可已接受），
      # 只需用 nttld/setup-ndk 装 NDK（官方 CI 同款做法）
      - name: Setup Android NDK r28
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28       # = 28.0.13004108，与 app/build.gradle 的 ndkVersion 一致

      # ---- 第 4 步：gomobile 交叉编译工具（对应 make lib_install）----
      - name: Install gomobile / gobind
        working-directory: sing-box
        shell: bash
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4

      # ---- 第 5 步：把 Go 核心编成 libbox.aar（对应 make lib_android）----
      # build_libbox 内部需要 ANDROID_NDK_HOME 走 findNDK 的兜底分支
      - name: Build libbox.aar
        working-directory: sing-box
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # app/libs 被 .gitignore 忽略，不预先建目录的话 build_libbox 会静默跳过拷贝
          mkdir -p ../sing-box-for-android/app/libs
          go run ./cmd/internal/build_libbox -target android
          ls -lh libbox.aar
          ls -lh ../sing-box-for-android/app/libs/libbox.aar

      # ---- 第 6 步：运行时生成全新生产签名 keystore ----
      # 每次构建随机生成一把新签名，口令随机，无需任何 secret。
      # 必须覆盖成 app/release.keystore 并写入 root 的 local.properties，
      # 因为 app/build.gradle 的 signingConfigs.release 是这么读的。
      # 注意：这把密钥每次都在变，签名不一致，无法覆盖升级（需卸载重装）。
      - name: Generate fresh release keystore
        working-directory: sing-box-for-android
        shell: bash
        run: |
          KS_PASS="$(openssl rand -hex 16)"          # 一个随机口令，store 和 key 共用
          ALIAS_NAME="sfa$(date +%s)"
          rm -f app/release.keystore
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -alias "$ALIAS_NAME" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SFA,O=SFA,L=NA,ST=NA,C=US" >/dev/null 2>&1
          # KEYSTORE_PASS 和 ALIAS_PASS 必须相同（PKCS12 键都用 store 口令加密）
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' \
            "$KS_PASS" "$ALIAS_NAME" "$KS_PASS" > local.properties
          echo "Generated fresh keystore, alias=$ALIAS_NAME"

      # ---- 第 7 步：Gradle 打 FOSS 版 APK（对应 assembleOtherRelease）----
      # 签名口令从第 6 步写的 local.properties 读取（getProps 文件分支）
      - name: Assemble FOSS release APK
        working-directory: sing-box-for-android
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew :app:assembleOtherRelease --no-daemon
          ls -lh app/build/outputs/apk/other/release/

      # ---- 第 8 步：上传 APK ----
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SFA-foss-APKs
          path: sing-box-for-android/app/build/outputs/apk/other/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sing-box-for-android/app/build/outputs/apk/other/release/*.apk
          draft: true
