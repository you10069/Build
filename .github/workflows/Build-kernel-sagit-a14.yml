name: Build Kernel sagit A14

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   # ubuntu-latest

    steps:
    - name: Build
      uses: dabao1955/kernel_build_action@main
      with:
        kernel-url: https://github.com/crdroidandroid/android_kernel_xiaomi_msm8998
        kernel-branch: 14.0
        # kernel-dir: false

        # vendor: false
        # vendor-url: https://github.com/AcmeUI-Devices/android_kernel_xiaomi_cas
        # vendor-branch: taffy
        # vendor-dir: false

        config: vendor/xiaomi/mi8998_defconfig
        config-from-boot: false
        # merge-configs: false   ["arch/arm64/configs/my.config"]

        arch: arm64
        android-version: 14

        ksu: false
        ksu-version: v0.9.5
        ksu-lkm: false

        ksu-other: false
        ksu-url: https://github.com/backslashxx/KernelSU/
        rekernel: false

        nomount: false


        aosp-clang: true
        aosp-clang-version: r383902   # default = r383902
        # https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/mirror-goog-main-llvm-toolchain-source/README.md
  			# AOSP官方预编译Clang编译器分支说明：
  			#   main-kernel               r596125   (最新编译器,适合5.10+新内核)
  			#   main-kernel-2026          r584948c
  			#   main-kernel-2025          r547379
  			#   main-kernel-build-2024    r510928
  			#   master-kernel-build-2022  r450784e  ✅ 安全选项，4.4/4.9/4.19老内核首选
  			#   master-kernel-build-2021  r416183b  ✅ 安全选项，4.4/4.9/4.19老内核首选
  		  # other-clang-url: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android16-release/clang-r547379.tar.gz   # Google Clang 19.x
  		  ## other-clang-branch: main


        aosp-gcc: true
        # other-gcc64-url: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2022.08-1.tar.bz2    # Bootlin GCC 11.x (aarch64)
        ## other-gcc64-branch: main
        # other-gcc32-url: https://toolchains.bootlin.com/downloads/releases/toolchains/armv7-eabihf/tarballs/armv7-eabihf--glibc--stable-2022.08-1.tar.bz2    # Bootlin GCC 11.x (arm)
        ## other-gcc32-branch: main



        disable-lto: false            # 禁用 LTO，避免老内核链接失败
        ccache: true                  # 开启缓存

        anykernel3: true
        # anykernel3-url: https://github.com/username/AnyKernel3
        # bootimg-url: https://github.com/username/AnyKernel3

        release: fasle
        access-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload kernel image
      uses: actions/upload-artifact@v7
      with:
        name: kernel
        path: kernel/source/arch/arm64/boot/Image.gz-dtb
        retention-days: 7
