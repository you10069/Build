name: Build custom CMFA arm64

on:
  workflow_dispatch:

env:
  # 日常只需要修改下面四项：源码版本、自编译修订号、应用名称和包名。
  VERSION: v2.11.32
  BUILD_REVISION: 1
  APP_NAME: MH-X
  APPLICATION_ID: pure.mihomo.x
  CMFA_REPOSITORY: MetaCubeX/ClashMetaForAndroid

jobs:
  build:
    name: Build custom app arm64-v8a
    runs-on: ubuntu-latest
    outputs:
      app_version_name: ${{ steps.prepare.outputs.version_name }}
      app_version_code: ${{ steps.prepare.outputs.version_code }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Derive safe APK and artifact name
        shell: bash
        run: |
          set -euo pipefail
          file_stem="$(
            printf '%s' "$APP_NAME" |
              sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//'
          )"
          if [[ -z "$file_stem" ]]; then
            echo "APP_NAME cannot be converted to a safe APK file name."
            exit 1
          fi
          echo "APP_FILE_STEM=$file_stem" >> "$GITHUB_ENV"

      - name: Checkout CMFA and Mihomo submodule
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CMFA_REPOSITORY }}
          ref: ${{ env.VERSION }}
          path: cmfa
          fetch-depth: 0
          submodules: recursive

      - name: Verify source checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f cmfa/build.gradle.kts
          test -f cmfa/core/src/foss/golang/clash/go.mod
          echo "CMFA ref: $(git -C cmfa describe --tags --always --dirty)"
          echo "Mihomo commit: $(git -C cmfa/core/src/foss/golang/clash rev-parse HEAD)"

      - name: Detect pinned Mihomo version
        shell: bash
        run: |
          set -euo pipefail
          core_dir="cmfa/core/src/foss/golang/clash"

          if [[ "$(git -C "$core_dir" rev-parse --is-shallow-repository)" == "true" ]]; then
            git -C "$core_dir" fetch --force --tags --unshallow origin
          else
            git -C "$core_dir" fetch --force --tags origin
          fi

          short_sha="$(git -C "$core_dir" rev-parse --short=7 HEAD)"
          exact_tag="$(
            git -C "$core_dir" tag \
              --points-at HEAD \
              --list 'v[0-9]*' |
              sort -V |
              tail -n 1
          )"

          if [[ -n "$exact_tag" ]]; then
            core_version="$exact_tag"
          else
            if base_tag="$(
              git -C "$core_dir" describe \
                --tags \
                --match 'v[0-9]*' \
                --abbrev=0 \
                HEAD 2>/dev/null
            )"; then
              core_version="${base_tag}-g${short_sha}"
            else
              core_version="g${short_sha}"
            fi
          fi

          echo "CORE_VERSION=$core_version" >> "$GITHUB_ENV"
          echo "Pinned Mihomo version: $core_version"

      - name: Detect the official Go toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          candidates = [
              Path("cmfa/.github/workflows/build-release.yaml"),
              Path("cmfa/.github/workflows/build-release.yml"),
              Path("cmfa/.github/workflows/build-debug.yaml"),
              Path("cmfa/.github/workflows/build-debug.yml"),
          ]
          workflow = next((path for path in candidates if path.is_file()), None)
          if workflow is None:
              raise SystemExit("Cannot find an official CMFA build workflow")

          content = workflow.read_text(encoding="utf-8")
          match = re.search(r"go-version:\s*['\"]?([^'\"\s]+)", content)
          if match is None:
              raise SystemExit(f"Cannot detect go-version from {workflow}")

          go_version = match.group(1)
          custom_go = "go-download-base-url:" in content
          root_build = Path("cmfa/build.gradle.kts").read_text(encoding="utf-8")
          ndk_match = re.search(r'ndkVersion\s*=\s*"([^"]+)"', root_build)
          if ndk_match is None:
              raise SystemExit("Cannot detect ndkVersion from cmfa/build.gradle.kts")

          ndk_version = ndk_match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"go_version={go_version}\n")
              output.write(f"custom_go={str(custom_go).lower()}\n")
              output.write(f"ndk_version={ndk_version}\n")

          print(f"Official workflow: {workflow}")
          print(f"Go version: {go_version}")
          print(f"Custom MetaCubeX Go: {custom_go}")
          print(f"Android NDK version: {ndk_version}")
          PY

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure stable release signing
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.MHX_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.MHX_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.MHX_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.MHX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required_secrets=(
            ANDROID_SIGNING_KEYSTORE_BASE64
            ANDROID_SIGNING_STORE_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS
            ANDROID_SIGNING_KEY_PASSWORD
          )

          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $secret_name"
              exit 1
            fi
          done

          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" |
            base64 --decode > cmfa/release.keystore
          test -s cmfa/release.keystore

          python3 - <<'PY'
          import os
          from pathlib import Path


          def property_value(value: str) -> str:
              if "\n" in value or "\r" in value:
                  raise SystemExit("Signing values must be single-line strings")

              escaped: list[str] = []
              for index, char in enumerate(value):
                  codepoint = ord(char)
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char == "\f":
                      escaped.append("\\f")
                  elif char in "=:#!":
                      escaped.append(f"\\{char}")
                  elif index == 0 and char == " ":
                      escaped.append("\\ ")
                  elif 0x20 <= codepoint <= 0x7E:
                      escaped.append(char)
                  else:
                      utf16 = char.encode("utf-16-be")
                      escaped.extend(
                          f"\\u{int.from_bytes(utf16[offset:offset + 2], 'big'):04x}"
                          for offset in range(0, len(utf16), 2)
                      )
              return "".join(escaped)


          values = {
              "keystore.password": os.environ["ANDROID_SIGNING_STORE_PASSWORD"],
              "key.alias": os.environ["ANDROID_SIGNING_KEY_ALIAS"],
              "key.password": os.environ["ANDROID_SIGNING_KEY_PASSWORD"],
          }
          content = "".join(
              f"{key}={property_value(value)}\n"
              for key, value in values.items()
          )
          Path("cmfa/signing.properties").write_text(content, encoding="ascii")
          PY

          chmod 600 cmfa/release.keystore cmfa/signing.properties

          signing_cert_sha256="$(
            keytool \
              -exportcert \
              -keystore cmfa/release.keystore \
              -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
              -alias "$ANDROID_SIGNING_KEY_ALIAS" |
              sha256sum |
              awk '{print $1}'
          )"
          if [[ ! "$signing_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not determine the release signing certificate SHA-256."
            exit 1
          fi

          echo "SIGNING_CERT_SHA256=$signing_cert_sha256" >> "$GITHUB_ENV"
          echo "Release signing certificate SHA-256: $signing_cert_sha256"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Ensure required Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set."
            exit 1
          fi

          ndk_version="${{ steps.toolchain.outputs.ndk_version }}"
          if [ -d "$sdk_root/ndk/$ndk_version" ]; then
            echo "Android NDK $ndk_version is already installed."
          else
            sdkmanager "ndk;$ndk_version"
          fi

      - name: Setup standard Go
        if: steps.toolchain.outputs.custom_go == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Setup official MetaCubeX Go
        if: steps.toolchain.outputs.custom_go == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false

      - name: Apply CMFA Go patches
        working-directory: cmfa
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=("$PWD"/.github/patch/*.patch)

          if (( ${#patches[@]} == 0 )); then
            echo "This CMFA version has no Go toolchain patches."
            exit 0
          fi

          patch_dir="$PWD/.github/patch"
          cd "$(go env GOROOT)"
          for patch_file in "$patch_dir"/*.patch; do
            echo "Applying $(basename "$patch_file")"
            patch --batch --forward --verbose -p 1 < "$patch_file"
          done

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-cmfa-${{ env.VERSION }}-go-${{ hashFiles('cmfa/**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-cmfa-${{ env.VERSION }}-go-
            ${{ runner.os }}-cmfa-go-

      - name: Disable Mihomo include-all sorting
        shell: bash
        run: |
          set -euo pipefail
          core_dir="cmfa/core/src/foss/golang/clash"
          config_file="$core_dir/config/config.go"

          python3 mihomo-scripts/disable_include_all_sort.py \
            --file "$config_file"

          gofmt -w "$config_file"
          git -C "$core_dir" diff --check
          git -C "$core_dir" diff -- config/config.go

      - name: Test patched Mihomo package
        working-directory: cmfa/core/src/foss/golang/clash
        shell: bash
        run: |
          set -euo pipefail
          go test \
            -tags "foss with_gvisor cmfa" \
            -count=1 \
            ./config

      - name: Update embedded CA certificate
        shell: bash
        run: |
          set -euo pipefail
          sudo update-ca-certificates
          test -f /etc/ssl/certs/ca-certificates.crt
          cp -f \
            /etc/ssl/certs/ca-certificates.crt \
            cmfa/core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Prepare custom arm64-only source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 mihomo-scripts/prepare_cmfa_app.py \
            --root cmfa \
            --version "${{ env.VERSION }}" \
            --build-revision "${{ env.BUILD_REVISION }}" \
            --core-version "${{ env.CORE_VERSION }}" \
            --app-name "${{ env.APP_NAME }}" \
            --application-id "${{ env.APPLICATION_ID }}"

      - name: Show and validate source changes
        working-directory: cmfa
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- \
            build.gradle.kts \
            core/build.gradle.kts \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/github/kr328/clash/MainApplication.kt \
            app/src/main/java/com/github/kr328/clash/NewProfileActivity.kt \
            design/src/main/java/com/github/kr328/clash/design/NewProfileDesign.kt \
            design/src/main/java/com/github/kr328/clash/design/model/ProfileProvider.kt

          grep -Fx "custom.application.id=${APPLICATION_ID}" local.properties
          grep -Fx "remove.suffix=true" local.properties
          grep -F \
            "resValue(\"string\", \"launch_name\", \"${APP_NAME}\")" \
            build.gradle.kts
          grep -F \
            "resValue(\"string\", \"application_name\", \"${APP_NAME}\")" \
            build.gradle.kts
          grep -F "versionName = \"${APP_VERSION_NAME}\"" build.gradle.kts
          grep -F "versionCode = ${APP_VERSION_CODE}" build.gradle.kts
          grep -F 'delete(file("release"))' app/build.gradle.kts

          for action in START_CLASH STOP_CLASH TOGGLE_CLASH; do
            expected='${applicationId}.action.'"${action}"
            grep -F "$expected" app/src/main/AndroidManifest.xml
          done
          if grep -F \
            'com.github.metacubex.clash.meta.action.' \
            app/src/main/AndroidManifest.xml; then
            echo "An official external-control action is still hard-coded."
            exit 1
          fi

          {
            echo "### Android app build"
            echo
            echo "- App: ${APP_NAME}"
            echo "- Package: ${APPLICATION_ID}"
            echo "- Version name: ${APP_VERSION_NAME}"
            echo "- Version code: ${APP_VERSION_CODE}"
            echo "- Pinned Mihomo: ${CORE_VERSION}"
            echo "- External control: package-scoped START/STOP/TOGGLE"
            echo "- Mihomo patch: include-all sorting off"
            echo "- Signing certificate SHA-256: \`${SIGNING_CERT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -RniE \
            'quickie|play-services-mlkit|ScanQRCode|ProfileProvider\.QR|downloadGeoFiles|geoFilesDownloadDir' \
            app/build.gradle.kts \
            app/src/main/java/com/github/kr328/clash/NewProfileActivity.kt \
            design/src/main/java/com/github/kr328/clash/design/NewProfileDesign.kt \
            design/src/main/java/com/github/kr328/clash/design/model/ProfileProvider.kt; then
            echo "QR or ML Kit source is still present."
            exit 1
          fi

      - name: Verify release dependency graph
        working-directory: cmfa
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:dependencies \
            --configuration metaReleaseRuntimeClasspath \
            > ../cmfa-runtime-dependencies.txt

          if grep -iE \
            'quickie|mlkit|play-services-mlkit|barcode-scanning' \
            ../cmfa-runtime-dependencies.txt; then
            echo "QR/ML Kit dependencies are still in the release runtime classpath."
            exit 1
          fi

      - name: Build Meta release APK
        working-directory: cmfa
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleMetaRelease

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(
            find cmfa/app/build/outputs/apk/meta/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print
          )

          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one arm64 APK, found ${#apks[@]}."
            find cmfa/app/build/outputs/apk/meta/release -maxdepth 1 -type f -print
            exit 1
          fi

          apk="${apks[0]}"
          unzip -Z1 "$apk" > apk-contents.txt

          aapt="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -maxdepth 2 \
              -type f \
              -name aapt \
              -print |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$aapt" || ! -x "$aapt" ]]; then
            echo "Could not find Android aapt for APK identity verification."
            exit 1
          fi

          apksigner="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -print |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "Could not find Android apksigner for APK signature verification."
            exit 1
          fi

          "$aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='${APPLICATION_ID}'" apk-badging.txt
          grep -F "versionCode='${APP_VERSION_CODE}'" apk-badging.txt
          grep -F "versionName='${APP_VERSION_NAME}'" apk-badging.txt
          grep -F "application-label:'${APP_NAME}'" apk-badging.txt

          "$aapt" dump xmltree "$apk" AndroidManifest.xml > apk-manifest.txt
          for action in START_CLASH STOP_CLASH TOGGLE_CLASH; do
            grep -F \
              "${APPLICATION_ID}.action.${action}" \
              apk-manifest.txt
          done
          if grep -F \
            'com.github.metacubex.clash.meta.action.' \
            apk-manifest.txt; then
            echo "The APK still exposes an official CMFA external-control action."
            exit 1
          fi

          "$apksigner" verify \
            --verbose \
            --print-certs \
            "$apk" > apk-signing.txt
          actual_signing_cert_sha256="$(
            sed -n \
              's/^Signer #1 certificate SHA-256 digest: //p' \
              apk-signing.txt |
              head -n 1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]:'
          )"
          if [[ "$actual_signing_cert_sha256" != "$SIGNING_CERT_SHA256" ]]; then
            echo "APK signing certificate does not match the configured release key."
            echo "Expected: $SIGNING_CERT_SHA256"
            echo "Actual:   ${actual_signing_cert_sha256:-not found}"
            exit 1
          fi
          echo "Verified APK release signature: $actual_signing_cert_sha256"

          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/' apk-contents.txt; then
            echo "The APK still contains a non-arm64 native library."
            grep -E 'lib/(armeabi-v7a|x86|x86_64)/' apk-contents.txt
            exit 1
          fi

          if ! grep -q '^lib/arm64-v8a/' apk-contents.txt; then
            echo "The APK does not contain arm64-v8a native libraries."
            exit 1
          fi

          if grep -Ei \
            '(^|/)(geoip\.metadb|geosite\.dat|ASN\.mmdb|BundleMRS\.7z)$' \
            apk-contents.txt; then
            echo "A removed Geo asset is still packaged in the APK."
            exit 1
          fi

          mkdir -p dist
          output="dist/${APP_FILE_STEM}-arm64-v8a.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "${output}.sha256"
          printf '%s\n' "$actual_signing_cert_sha256" \
            > "dist/${APP_FILE_STEM}-signing-cert-sha256.txt"

          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_FILE_STEM }}-${{ env.VERSION }}-arm64-v8a
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Set release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_stem="$(
            printf '%s' "$APP_NAME" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//'
          )"
          if [[ -z "$tag_stem" ]]; then
            echo "APP_NAME cannot be converted to a safe release tag."
            exit 1
          fi
          echo "RELEASE_TAG=${tag_stem}-${VERSION}-arm64-$(date +%Y%m%d%H%M)" \
            >> "$GITHUB_ENV"

      - name: Upload GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_NAME }} ${{ needs.build.outputs.app_version_name }} arm64-v8a
          files: release-files/*
          draft: false
          prerelease: true
          make_latest: false
